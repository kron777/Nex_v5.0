name: tests

# Runs the full suite under the live-data guard (tests/conftest.py redirects
# NEX5_DATA_DIR to a temp dir and forbids writes under data/). The gate
# (scripts/check_test_baseline.py) deselects the known-intentional failures
# listed in tests/known_failures.txt and fails on anything else.
#
# Several tests exercise the real sentence-transformers model indirectly
# (synergizer, compassion, novel-association, predictive-substrate, …), so the
# all-MiniLM-L6-v2 model is downloaded once and cached; the test run itself is
# then offline against that cache.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache the embeddings model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Install CPU torch (avoid the CUDA wheel pulled transitively)
        run: pip install "torch" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pre-download embeddings model (cached across runs)
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Run suite with baseline gate
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python scripts/check_test_baseline.py
