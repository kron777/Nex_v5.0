name: tests

# The suite runs inside a disposable Docker container. Test code receives no
# host mounts, credentials, network, writable source tree, or live NEX data.
# Dependency/model acquisition occurs while building the image, before tests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build disposable test image
        run: docker build --pull --file ci/test-sandbox/Dockerfile --tag nex5-test-sandbox:${GITHUB_SHA} .

      - name: Verify sandbox and run full baseline suite
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 6g \
            --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=4g,mode=1777 \
            --env HOME=/tmp/home \
            --env TMPDIR=/tmp \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env TORCH_HOME=/tmp/torch \
            --env NEX5_DATA_DIR=/tmp/nex5-data \
            --env HF_HOME=/opt/hf-cache \
            --env HF_HUB_OFFLINE=1 \
            --env TRANSFORMERS_OFFLINE=1 \
            --env PYTHONPATH=/workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_NOSYSTEM=1 \
            --env GIT_CONFIG_GLOBAL=/dev/null \
            --env GIT_OPTIONAL_LOCKS=0 \
            --workdir /workspace \
            nex5-test-sandbox:${GITHUB_SHA} \
            /bin/sh -eu -c 'mkdir -p "$HOME" "$XDG_CACHE_HOME" "$TORCH_HOME" "$NEX5_DATA_DIR" && python ci/test-sandbox/probe.py && python scripts/check_test_baseline.py && python mind_map/mind_map.py --check --verify'
