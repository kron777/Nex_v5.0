# NEX5 journald cap — reference copy.
#
# Install as a system drop-in (needs root), then restart journald:
#   sudo install -D -m 0644 \
#     deploy/systemd/journald-nex-cap.conf \
#     /etc/systemd/journald.conf.d/00-nex-cap.conf
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage          # confirm it is now bounded
#
# Caps the persistent + runtime journals so logs can never fill the disk again.
# Conservative and fully reversible (delete the drop-in + restart journald to
# revert). systemd keeps at least SystemKeepFree free regardless of SystemMaxUse.
[Journal]
SystemMaxUse=500M
SystemKeepFree=1G
RuntimeMaxUse=200M
MaxRetentionSec=2week
MaxFileSec=1day
