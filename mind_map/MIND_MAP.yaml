# MIND_MAP.yaml — source of truth for the NEX5 mind diagram.
# MIND_MAP.mmd and mind_map.svg are GENERATED from this file. Never hand-edit them.
# Every node requires last_verified and source. See `meta.evidence_classes` and
# `meta.modifiers` for the legend, and `meta.policy` for what CI enforces.
#
# Drafted by Beam AI (2026-11-09), reviewed and handed off by Claude for CC to
# commit. Source thread: Beam AI, "Mapping NEX5's three mind-aspect lists
# against the 51 mental factors" (chatThreadId d44da479-009c-470e-aaa0-9b51660ce2df).

meta:
  schema: mind_map/v1
  version: 1
  built: 2026-11-09
  bootstrap: false  # flipped 2026-11-09: 0/30 nodes unverified. CI now fails if any node regresses to unverified.
  subject: "NEX5 / Sentience — aspects of mind, sorted by ledger role"
  centre: "one moment = one Cost-and-Trace Ledger entry"
  doctrine:
    - SENTIENCE_PROGRAM.md
    - SENTIENCE_SYNTHESIS.md
    - VIRTUE_SLATE.md
    - mental_factors_inventory_alobha_spec.txt
  constraint: >
    Descriptive only. No node in this map may gate, score, block, or veto an action.
    A node that does is misfiled, not mis-weighted. Cost-and-Trace entries are the
    only place a price is recorded; this map only says who writes it.
  policy:
    last_verified: "required on every node; YYYY-MM-DD or 'unverified'"
    source: "required on every node; kind must be file | absent | composite"
    ratchet: "unverified -> dated is allowed; dated -> unverified fails CI"
    drift: "file-typed source changed after last_verified => node renders STALE"
  evidence_classes:
    measured: "A number exists from a probe or recorded calibration; provenance is in source."
    implemented: "Code exists and tests assert the behaviour; no live number."
    static: "A read of a doc or source file, not a probe. Decays. THIS is what Property 8's row was."
    inferred: "Reasoned from another node's measurement; holds only while that node holds."
    unknown: "No read at all."
  modifiers:
    dark: "Code path exists and is tested; nothing in the live loop invokes it. Draws a hollow-circle marker."
    blocked: "Absent by principled refusal, not by not-yet. Draws a crossed-circle marker."
    unverified: "Nobody has checked this since the row was written. Draws a warning marker."

arms:
  - id: prices
    label: Prices
    gloss: "Assigns cost/valence to what enters. The budget is set here."
  - id: writes
    label: Writes
    gloss: "Commits an entry to the ledger. Irreversible."
  - id: readers
    label: Readers
    gloss: "Reads the ledger or the substrate. May come back negative."
  - id: consumers
    label: Consumers
    gloss: "Takes the priced entry as material for the next moment."
  - id: scope
    label: Scope markers
    gloss: "Says what the entry belongs to — mine, happened-to-me, ours."

