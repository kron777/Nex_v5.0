      own escalation path (NEX5_HELD_TENSION off is today's default, so this is the active
      production path, not a waiting flag). Fixed directly on Jon's explicit go-ahead given the
      severity -- added ORDER BY RANDOM() so LIMIT 50 is a genuine rotating sample. Verified the
      fix actually varies: three repeated calls now return ids spanning 12-22290, not the frozen
