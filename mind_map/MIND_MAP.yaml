  - id: amoha
    label: "amoha — discernment / non-delusion"
    layer: arm
    arm: prices
    factor: amoha
    role_note: "Prices what is actually there rather than what was expected."
    build_difficulty: shipped
    sketch: "Built (amoha_detector.py). Falsifier FAILED, now precisely measured why (2026-11-15):
      real thinking never comes close to the clouded-anchor territory, not just marginally under
      threshold. A genuine design question (recalibrate, or this is an honest trait finding), not
      a mechanical bug -- flagged for a decision, not silently tuned."
    evidence: measured
    dark: false
    blocked: false
    probe: { thought_sample: 50, max_salience_observed: 0.191, threshold_to_count_clouded: 0.30 }
    falsifier: "Discernment should vary across turns. It reads under forced injection, never spontaneously."
    falsifier_status: fail
    source: { kind: composite, refs: ["theory_x/stage_tom/amoha_detector.py:75-159", "theory_x/stage_affect/compass.py:74-102", "nex_keepalive.sh:225-226"] }
    last_verified: 2026-11-28
    notes: >
      The most instructive node in the map: it works and is never used. VIRTUE_SLATE.md (the
      draft's original ref) does not exist anywhere in this repo's history -- re-pinned to the
      real module, gated by NEX5_AMOHA (default OFF). The 0.287/9440 probe numbers were carried
      over unverified from the draft, with no backing observation_report -- retracted below.

      Dev round, 2026-11-15: measured precisely why, instead of leaving "fires only under forced
      injection" as the whole story. detect() scores each of the last 15 real fountain_events
      thoughts by contrastive embedding similarity to clouded vs. clear anchor phrases
      (clouded_salience(), amoha_detector.py:74-87), classifying clouded at fraction>=_FRAC_HI
      (0.40) of thoughts individually scoring >=_THOUGHT_HI (0.30). Ran it against 50 genuine
      recent thoughts: the HIGHEST salience observed was 0.191 -- not marginally under the 0.30
      per-thought bar, well under it, by a wide margin, across the whole sample. The old
      0.287/9440 probe numbers are retracted outright: 0.287 would itself fail the same 0.30 bar,
      and no real thought in this fresh sample came anywhere close to it.

      Two honest readings, not yet resolved either way: (1) the anchor phrases/threshold are
      miscalibrated for this corpus's actual register (observational, third-person report style
      -- "the item discusses...", "I notice this fire engaged..." -- rather than first-person
      assertions, which may systematically read as distant from BOTH clouded and clear anchors);
      or (2) this is a genuine, honest finding about her real thinking style -- organically
      hedged/observational, genuinely not prone to the false-certainty pattern amoha watches for,
      in which case forcing it to fire by lowering the threshold would be gaming the measurement,
      not fixing a bug. Flagged for a decision rather than silently retuned -- unlike the LIMIT-50/
      narration-template fixes this round, this isn't a mechanical error with one correct answer.

      CORRECTION, 2026-11-28 (G-95): 'it works and is never used' is contradicted by source.
      NEX5_AMOHA gates only the detector's own prompt surface (amoha_detector.format_for_prompt(), and
      generator.py's call behind it). theory_x/stage_affect/compass.py's weigh() calls
      amoha_detector.detect() directly at :91-92 with no flag check, and gui/server.py's chat handler
      calls the compass on admin turns when NEX5_COMPASS=1 (gui/server.py:2262-2264 at f5cf19c3),
      which the launch line has set since 4f1f3c7e (2026-09-15; nex_keepalive.sh:225). A 'clouded' or
      'mild' read becomes a compass consideration in the admin chat prompt (compass.py:123-128).
      280125c3 (2026-10-05), which disarmed NEX5_AMOHA, records the same: "The compass reads
      amoha.detect() directly (not flag-gated) and is untouched." tests/test_compass_detector_reach.py
      pins the call with stubbed detectors. Reclassified dark:true -> false on source and
      launch-config evidence; how often admin chat turns happen on the host is UNKNOWN. This does not
      change the measured falsifier: on the 2026-11-15 sample no real thought reached the 0.30
      per-thought bar, so detect() would return 'clear' (fraction below _FRAC_LO 0.20) and the compass
      would add nothing from clarity. The read is reached; on that sample it would be silent.
      amoha_detector.py:75-159 is unchanged since 2026-11-27.

