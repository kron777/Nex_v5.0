      at once, naturally far more selective: template-stripped AND-based overlap on random
      triples measured 2.7%, no embedding model needed (template-stripping alone was enough here).
      But the FULL production function, checked against 150 real random pairs (each against its
      own fresh 50-candidate sample), measures 12.0% false-bridge -- higher than the isolated
      2.7%, because 50 independent chances per pair compound even a low per-candidate rate.
      Reaching kaukṛtya's own 8% would need the same switch to embedding similarity -- not applied
      here, since this function sits on the ALWAYS-LIVE resolve() path (not a dark feature), and
