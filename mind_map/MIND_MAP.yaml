      its B is "the problem is closed" -- a cross-moment giveup mechanism over problem_memory
      (problem_memory.py:204's close(problem_id) takes a persistent id, not a single moment's
      candidate). vicikitsā's own directive is about THIS moment's candidate never being priced at
      all, win or lose -- a within-moment refusal, not a multi-moment abandonment after repeated
      doubt. Distinct mechanisms; this one does not satisfy the falsifier's "declined as a
      detector" framing either (it is a real, live, armed detector -- just answering a different
      question than vicikitsā asks).

      Still genuinely absent for vicikitsā's actual directive. The "declined as a detector" note is
      itself worth keeping -- the original design call (prompt-level injection only) was never
      implemented even at that reduced scope, and no stronger candidate surfaced in this round's
      search.

